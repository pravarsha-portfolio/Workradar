nt-family="IBM Plex Sans" font-size="18" font-weight="400" fill="#566370" xml:space="preserve">spend their mornings helping the team and answering leaders.</text></g><g id="cover-qs"><g id="cover-q"><rect x="64" y="448.140625" width="317.5" height="87.375" rx="12" fill="#ffffff"/><rect x="64.5" y="448.640625" width="316.5" height="86.375" rx="11.5" fill="none" stroke="#d9e0e6" stroke-width="1"/><text x="83" y="485.14" font-family="Bricolage Grotesque" font-size="19" font-weight="500" fill="#14202b" xml:space="preserve">What is my top work today?</text></g><g id="cover-q"><rect x="395.5" y="448.140625" width="317.5" height="87.375" rx="12" fill="#ffffff"/><rect x="396" y="448.640625" width="316.5" height="86.375" rx="11.5" fill="none" stroke="#d9e0e6" stroke-width="1"/><text x="414.5" y="485.14" font-family="Bricolage Grotesque" font-size="19" font-weight="500" fill="#14202b" xml:space="preserve">What happened since</text><text x="414.5" y="509.83" font-family="Bricolage Grotesque" font-size="19" font-weight="500" fill="#14202b" xml:space="preserve">yesterday?</text></g><g id="cover-q"><rect x="727" y="448.140625" width="317.5" height="87.375" rx="12" fill="#ffffff"/><rect x="727.5" y="448.640625" width="316.5" height="86.375" rx="11.5" fill="none" stroke="#d9e0e6" stroke-width="1"/><text x="746" y="485.14" font-family="Bricolage Grotesque" font-size="19" font-weight="500" fill="#14202b" xml:space="preserve">What needs my attention</text><text x="746" y="509.83" font-family="Bricolage Grotesque" font-size="19" font-weight="500" fill="#14202b" xml:space="preserve">now?</text></g><g id="cover-q"><rect x="1058.5" y="448.140625" width="317.5" height="87.375" rx="12" fill="#ffffff"/><rect x="1059" y="448.640625" width="316.5" height="86.375" rx="11.5" fill="none" stroke="#d9e0e6" stroke-width="1"/><text x="1077.5" y="485.14" font-family="Bricolage Grotesque" font-size="19" font-weight="500" fill="#14202b" xml:space="preserve">Who is blocked, and is it on</text><text x="10